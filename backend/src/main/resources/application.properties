server.port=8080

# Read-only MySQL account (SELECT privilege only) -- see database/schema_and_seed.sql
spring.datasource.url=jdbc:mysql://localhost:3306/bi_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=bi_readonly
spring.datasource.password=ReadOnly_2026

# LLM: Google Gemini through its OpenAI-compatible endpoint (free tier, no credits needed).
# Set GEMINI_API_KEY as an environment variable; never commit the key.
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=gemini-3.8-flash
spring.ai.openai.chat.options.temperature=0.0

